name: Prepare static website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML and legal pages
        run: |
          test -s index.html
          test -s impressum.html
          test -s datenschutz.html
          test -s robots.txt
          grep -qi '<html' index.html
          grep -q 'impressum.html' index.html
          grep -q 'datenschutz.html' index.html
